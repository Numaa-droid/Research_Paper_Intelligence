<rect x="364" y="352" width="250" height="3" rx="1.5" fill="#8b5cf6" fill-opacity=".9"/>
<rect x="370" y="374" width="52" height="52" rx="14" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-opacity=".45"/><rect x="390.0" y="381.0" width="12" height="10" rx="2" fill="none" stroke="#8b5cf6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="376.0" y="409.0" width="12" height="10" rx="2" fill="none" stroke="#8b5cf6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="390.0" y="409.0" width="12" height="10" rx="2" fill="none" stroke="#8b5cf6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="404.0" y="409.0" width="12" height="10" rx="2" fill="none" stroke="#8b5cf6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M396.0 391.0v18M396.0 400.0h-14v9M396.0 400.0h14v9" fill="none" stroke="#8b5cf6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="438.0" y="393.0" font-size="11" fill="#c4b5fd" font-weight="700" letter-spacing="1.4">SPECIALIST</text>
<text class="sans" x="438.0" y="418.0" font-size="20" fill="#e7ecf6" font-weight="800">Methodology</text>
<text class="sans" x="370.0" y="454.0" font-size="13.5" fill="#a9b4cc">Architecture, training, inference,</text>
<text class="sans" x="370.0" y="474.0" font-size="13.5" fill="#a9b4cc">design decisions, prior work.</text>
<rect x="370.0" y="488" width="63" height="26" rx="13.0" fill="#8b5cf6" fill-opacity=".13" stroke="#8b5cf6" stroke-opacity=".5"/><text class="sans" x="401.5" y="505.3" font-size="12" fill="#c4b5fd" font-weight="600" text-anchor="middle">always</text>
<rect x="652" y="352" width="278" height="178" rx="16" fill="#0d1424" stroke="#2dd4bf" stroke-opacity=".4" filter="url(#shadow)"/>
<rect x="666" y="352" width="250" height="3" rx="1.5" fill="#2dd4bf" fill-opacity=".9"/>
<rect x="672" y="374" width="52" height="52" rx="14" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".45"/><path d="M681.0 382.0v36h34" fill="none" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M688.0 410.0v-8M696.0 410.0v-16M704.0 410.0v-11M712.0 410.0v-22" fill="none" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="740.0" y="393.0" font-size="11" fill="#5eead4" font-weight="700" letter-spacing="1.4">SPECIALIST</text>
<text class="sans" x="740.0" y="418.0" font-size="20" fill="#e7ecf6" font-weight="800">Experiments</text>
<text class="sans" x="672.0" y="454.0" font-size="13.5" fill="#a9b4cc">Datasets, baselines, metrics,</text>
<text class="sans" x="672.0" y="474.0" font-size="13.5" fill="#a9b4cc">ablations, significance.</text>
<rect x="672.0" y="488" width="172" height="26" rx="13.0" fill="#2dd4bf" fill-opacity=".13" stroke="#2dd4bf" stroke-opacity=".5"/><text class="sans" x="758.2" y="505.3" font-size="12" fill="#5eead4" font-weight="600" text-anchor="middle">when results are found</text>
<rect x="954" y="352" width="278" height="178" rx="16" fill="#0d1424" stroke="#f59e0b" stroke-opacity=".4" filter="url(#shadow)"/>
<rect x="968" y="352" width="250" height="3" rx="1.5" fill="#f59e0b" fill-opacity=".9"/>
<rect x="974" y="374" width="52" height="52" rx="14" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-opacity=".45"/><path d="M1013.0 384.0h-26l14 16l-14 16h26" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="1042.0" y="393.0" font-size="11" fill="#fcd34d" font-weight="700" letter-spacing="1.4">SPECIALIST</text>
<text class="sans" x="1042.0" y="418.0" font-size="20" fill="#e7ecf6" font-weight="800">Math</text>
<text class="sans" x="974.0" y="454.0" font-size="13.5" fill="#a9b4cc">Equations, variables, losses,</text>
<text class="sans" x="974.0" y="474.0" font-size="13.5" fill="#a9b4cc">objectives, derivations.</text>
<rect x="974.0" y="488" width="207" height="26" rx="13.0" fill="#f59e0b" fill-opacity=".13" stroke="#f59e0b" stroke-opacity=".5"/><text class="sans" x="1077.3" y="505.3" font-size="12" fill="#fcd34d" font-weight="600" text-anchor="middle">only if the paper has maths</text>
