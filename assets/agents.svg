<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="t d">
  <title id="t">The PaperMind agent team</title>
  <desc id="d">The planner fans a paper out to specialist agents: summary, methodology, experiments, and math only when the paper has mathematics. Their findings merge into the verification agent, then the synthesizer.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#c9b98f" fill-opacity=".45"/></pattern>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#5c4a24" flood-opacity=".18"/></filter>
    <marker id="aInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2a44"/></marker>
    <marker id="aCoral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d4573a"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f855a"/></marker>
    <style>
      .serif{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .ink{stroke-dasharray:7 6;animation:ink 1.4s linear infinite}
      @keyframes ink{to{stroke-dashoffset:-26}}
      .glow{animation:glow 2.6s ease-in-out infinite}
      @keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.ink,.glow{animation:none}}
    </style>
  </defs>
  <rect width="1280" height="600" rx="18" fill="#fbf7ef"/>
  <rect width="1280" height="600" rx="18" fill="url(#dots)"/>
  <rect x="1" y="1" width="1278" height="598" rx="17" fill="none" stroke="#e7dcc6" stroke-width="2"/>

<text class="serif" x="56.0" y="74.0" font-size="32" fill="#1f2a44" font-weight="700" letter-spacing="-.3">The agent team</text><rect x="56" y="86" width="56" height="4" rx="2" fill="#d4573a"/><text class="sans" x="56.0" y="116.0" font-size="15.5" fill="#5b6475">No agent reads the whole PDF, and agents never pass prose to each other: only validated, typed findings.</text>
<path d="M60 292 h92 l26 26 v114 h-118 z" fill="#ffffff" stroke="#1f2a44" stroke-width="1.6" filter="url(#lift)"/>
<path d="M152 292 v26 h26" fill="none" stroke="#1f2a44" stroke-width="1.6"/>
<line x1="76" y1="338" x2="160" y2="338" stroke="#d8d2c4" stroke-width="3" stroke-linecap="round"/>
<line x1="76" y1="354" x2="160" y2="354" stroke="#d8d2c4" stroke-width="3" stroke-linecap="round"/>
<line x1="76" y1="370" x2="160" y2="370" stroke="#d8d2c4" stroke-width="3" stroke-linecap="round"/>
<line x1="76" y1="386" x2="160" y2="386" stroke="#d8d2c4" stroke-width="3" stroke-linecap="round"/>
<line x1="76" y1="402" x2="122" y2="402" stroke="#d8d2c4" stroke-width="3" stroke-linecap="round"/>
<text class="serif" x="119.0" y="460.0" font-size="15" fill="#1f2a44" font-weight="700" text-anchor="middle" font-style="italic">one paper</text>
<path class="ink" d="M184 362 H234" stroke="#1f2a44" stroke-width="2" marker-end="url(#aInk)"/>
<circle cx="330" cy="362" r="92" fill="none" stroke="#d4573a" stroke-width="1.4" stroke-dasharray="3 5"/>
<circle cx="330" cy="362" r="82" fill="#1f2a44"/>
<text class="serif" x="330.0" y="356.0" font-size="22" fill="#fff" font-weight="700" text-anchor="middle">Planner</text>
<text class="sans" x="330.0" y="378.0" font-size="12" fill="#cfd5e2" text-anchor="middle">picks the specialists</text>
<text class="sans" x="330.0" y="394.0" font-size="12" fill="#cfd5e2" text-anchor="middle">and says why</text>
<path d="M534 173.0 v-12 q0 -4 4 -4 h57 q4 0 4 4 v12 z" fill="#dce8f5" stroke="#2b6cb0" stroke-width="1.4"/>
<text class="sans" x="545.0" y="169.0" font-size="9.5" fill="#1f4f82" font-weight="700" letter-spacing=".5">ALWAYS</text>
<rect x="520" y="173.0" width="400" height="78" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.6" filter="url(#lift)"/>
<circle cx="558" cy="212.0" r="20" fill="#dce8f5" stroke="#2b6cb0" stroke-width="1.6"/>
<text class="serif" x="558.0" y="219.0" font-size="19" fill="#1f4f82" font-weight="700" text-anchor="middle">S</text>
<text class="serif" x="592.0" y="208.0" font-size="18" fill="#1f2a44" font-weight="700">Summary</text>
<text class="sans" x="592.0" y="229.0" font-size="12.5" fill="#5b6475">problem, contribution, data, results, limits</text>
<path class="ink" d="M424 362 C 482 362, 450 212.0, 512 212.0" fill="none" stroke="#2b6cb0" stroke-width="2" marker-end="url(#aInk)"/>
<path d="M534 273.0 v-12 q0 -4 4 -4 h57 q4 0 4 4 v12 z" fill="#fbe4dc" stroke="#d4573a" stroke-width="1.4"/>
<text class="sans" x="545.0" y="269.0" font-size="9.5" fill="#a8412a" font-weight="700" letter-spacing=".5">ALWAYS</text>
<rect x="520" y="273.0" width="400" height="78" rx="8" fill="#ffffff" stroke="#d4573a" stroke-width="1.6" filter="url(#lift)"/>
<circle cx="558" cy="312.0" r="20" fill="#fbe4dc" stroke="#d4573a" stroke-width="1.6"/>
<text class="serif" x="558.0" y="319.0" font-size="19" fill="#a8412a" font-weight="700" text-anchor="middle">M</text>
<text class="serif" x="592.0" y="308.0" font-size="18" fill="#1f2a44" font-weight="700">Methodology</text>
<text class="sans" x="592.0" y="329.0" font-size="12.5" fill="#5b6475">architecture, training, inference, design</text>
<path class="ink" d="M424 362 C 482 362, 450 312.0, 512 312.0" fill="none" stroke="#d4573a" stroke-width="2" marker-end="url(#aInk)"/>
<path d="M534 373.0 v-12 q0 -4 4 -4 h152 q4 0 4 4 v12 z" fill="#dcefe3" stroke="#2f855a" stroke-width="1.4"/>
<text class="sans" x="545.0" y="369.0" font-size="9.5" fill="#22643f" font-weight="700" letter-spacing=".5">WHEN RESULTS ARE FOUND</text>
<rect x="520" y="373.0" width="400" height="78" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.6" filter="url(#lift)"/>
<circle cx="558" cy="412.0" r="20" fill="#dcefe3" stroke="#2f855a" stroke-width="1.6"/>
<text class="serif" x="558.0" y="419.0" font-size="19" fill="#22643f" font-weight="700" text-anchor="middle">E</text>
<text class="serif" x="592.0" y="408.0" font-size="18" fill="#1f2a44" font-weight="700">Experiments</text>
<text class="sans" x="592.0" y="429.0" font-size="12.5" fill="#5b6475">datasets, baselines, metrics, ablations</text>
<path class="ink" d="M424 362 C 482 362, 450 412.0, 512 412.0" fill="none" stroke="#2f855a" stroke-width="2" marker-end="url(#aInk)"/>
<path d="M534 473.0 v-12 q0 -4 4 -4 h182 q4 0 4 4 v12 z" fill="#f8ecc9" stroke="#c98a12" stroke-width="1.4"/>
<text class="sans" x="545.0" y="469.0" font-size="9.5" fill="#8f6209" font-weight="700" letter-spacing=".5">ONLY IF THE PAPER HAS MATHS</text>
<rect x="520" y="473.0" width="400" height="78" rx="8" fill="#ffffff" stroke="#c98a12" stroke-width="1.6" filter="url(#lift)"/>
<circle cx="558" cy="512.0" r="20" fill="#f8ecc9" stroke="#c98a12" stroke-width="1.6"/>
<text class="serif" x="558.0" y="519.0" font-size="19" fill="#8f6209" font-weight="700" text-anchor="middle">Σ</text>
<text class="serif" x="592.0" y="508.0" font-size="18" fill="#1f2a44" font-weight="700">Math</text>
<text class="sans" x="592.0" y="529.0" font-size="12.5" fill="#5b6475">equations, variables, losses, derivations</text>
<path class="ink" d="M424 362 C 482 362, 450 512.0, 512 512.0" fill="none" stroke="#c98a12" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="1010" y="234" width="222" height="120" rx="10" fill="#dcefe3" stroke="#2f855a" stroke-width="1.8"/>
<path d="M1044 254l16 6v12c0 11-7 18-16 22c-9-4-16-11-16-22v-12z" fill="#ffffff" stroke="#2f855a" stroke-width="2"/><path d="M1037 273l5 5 9-10" fill="none" stroke="#2f855a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="serif" x="1072.0" y="272.0" font-size="18" fill="#22643f" font-weight="700">Verification</text>
<text class="sans" x="1072.0" y="291.0" font-size="13" fill="#22643f">agent</text>
<text class="sans" x="1028.0" y="322.0" font-size="12.5" fill="#1f2a44">fetches the evidence itself;</text>
<text class="sans" x="1028.0" y="340.0" font-size="12.5" fill="#1f2a44">code checks quotes + numbers</text>
<path d="M924 212.0 C 970 212.0, 960 294.0, 1004 294.0" fill="none" stroke="#2f855a" stroke-width="1.6" stroke-opacity=".75" marker-end="url(#aGreen)"/>
<path d="M924 312.0 C 970 312.0, 960 294.0, 1004 294.0" fill="none" stroke="#2f855a" stroke-width="1.6" stroke-opacity=".75" marker-end="url(#aGreen)"/>
<path d="M924 412.0 C 970 412.0, 960 294.0, 1004 294.0" fill="none" stroke="#2f855a" stroke-width="1.6" stroke-opacity=".75" marker-end="url(#aGreen)"/>
<path d="M924 512.0 C 970 512.0, 960 294.0, 1004 294.0" fill="none" stroke="#2f855a" stroke-width="1.6" stroke-opacity=".75" marker-end="url(#aGreen)"/>
<path class="ink" d="M1121.0 358 V406" stroke="#2f855a" stroke-width="2" marker-end="url(#aGreen)"/>
<text class="serif" x="1131.0" y="388.0" font-size="12" fill="#22643f" font-weight="600" font-style="italic">verified findings</text>
<rect x="1010" y="412" width="222" height="86" rx="10" fill="#f8ecc9" stroke="#c98a12" stroke-width="1.8"/>
<text class="serif" x="1028.0" y="444.0" font-size="18" fill="#8f6209" font-weight="700">Synthesizer</text>
<text class="sans" x="1028.0" y="467.0" font-size="12.5" fill="#1f2a44">writes the report from validated</text>
<text class="sans" x="1028.0" y="485.0" font-size="12.5" fill="#1f2a44">findings. No model call.</text>
<path d="M1040 228 C 1000 174, 930 103.0, 890 151.0" fill="none" stroke="#d4573a" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#aCoral)"/>
<text class="serif" x="1050.0" y="194.0" font-size="12.5" fill="#a8412a" font-weight="600" font-style="italic">failed to ground: retried</text>
</svg>