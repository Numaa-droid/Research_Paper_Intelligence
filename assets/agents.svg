<text class="sans" x="136.0" y="206.0" font-size="20" fill="#e7ecf6" font-weight="800">One paper</text>
<text class="sans" x="68.0" y="242.0" font-size="13.5" fill="#a9b4cc">A research-paper PDF,</text>
<text class="sans" x="68.0" y="262.0" font-size="13.5" fill="#a9b4cc">indexed page by page.</text>
