<text class="sans" x="112" y="596" font-size="13.5" fill="#a9b4cc"><tspan font-size="14.5" font-weight="700" fill="#e7ecf6">Verification agent:</tspan> re-retrieves evidence for every high-impact claim on its own, then code checks pages, quotes and numbers. Failed agents are retried.</text>
