<text class="sans" x="136.0" y="393.0" font-size="11" fill="#67e8f9" font-weight="700" letter-spacing="1.4">SPECIALIST</text>
<text class="sans" x="136.0" y="418.0" font-size="20" fill="#e7ecf6" font-weight="800">Summary</text>
<text class="sans" x="68.0" y="454.0" font-size="13.5" fill="#a9b4cc">Problem, contribution, data,</text>
<text class="sans" x="68.0" y="474.0" font-size="13.5" fill="#a9b4cc">method, results, limitations.</text>
