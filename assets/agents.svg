<path class="flow" d="M838 206.0 H926" stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#arrowG)"/>
<text class="sans" x="882.0" y="194.0" font-size="11.5" fill="#86efac" font-weight="600" text-anchor="middle">verified findings</text>
