<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="t d">
  <title id="t">PaperMind: citation-grounded multi-agent analysis of research papers</title>
  <desc id="d">A research-paper page with its Table 1 row highlighted, and a margin note: the claim that SRT-Large reaches 81.4 F1 on NarrativeQA is supported, its quote was found and its number matches.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#c9b98f" fill-opacity=".45"/></pattern>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#5c4a24" flood-opacity=".18"/></filter>
    <marker id="aInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2a44"/></marker>
    <marker id="aCoral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d4573a"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f855a"/></marker>
    <style>
      .serif{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .ink{stroke-dasharray:7 6;animation:ink 1.4s linear infinite}
      @keyframes ink{to{stroke-dashoffset:-26}}
      .glow{animation:glow 2.6s ease-in-out infinite}
      @keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.ink,.glow{animation:none}}
    </style>
  </defs>
  <rect width="1280" height="460" rx="18" fill="#fbf7ef"/>
  <rect width="1280" height="460" rx="18" fill="url(#dots)"/>
  <rect x="1" y="1" width="1278" height="458" rx="17" fill="none" stroke="#e7dcc6" stroke-width="2"/>

<circle cx="86" cy="80" r="24" fill="#d4573a"/>
<path d="M73 72c5-3 9-3 13 0v17c-4-3-8-3-13 0zM99 72c-5-3-9-3-13 0v17c4-3 8-3 13 0z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
<text class="serif" x="122.0" y="76.0" font-size="20" fill="#1f2a44" font-weight="700">PaperMind</text>
<text class="sans" x="122.0" y="97.0" font-size="13.5" fill="#5b6475">Citation-grounded analysis of research papers</text>
<text class="serif" x="64.0" y="186.0" font-size="46" fill="#1f2a44" font-weight="700" letter-spacing="-.8">Every claim, checked</text>
<rect x="60" y="222" width="397" height="24" rx="4" fill="#fde68a"/>
<text class="serif" x="64.0" y="242.0" font-size="46" fill="#a8412a" font-weight="700" letter-spacing="-.8">against the page.</text>
<text class="sans" x="64.0" y="294.0" font-size="18.5" fill="#5b6475">Specialist agents read one research paper. A verifier</text>
<text class="sans" x="64.0" y="320.0" font-size="18.5" fill="#5b6475">re-checks every high-impact claim against the PDF.</text>
<rect x="64" y="356" width="178" height="32" rx="5" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.4"/><rect x="64" y="356" width="6" height="32" rx="3" fill="#2b6cb0"/><text class="sans" x="82.0" y="377.0" font-size="13" fill="#1f4f82" font-weight="600">Page-level citations</text>
<rect x="254.2" y="356" width="178" height="32" rx="5" fill="#ffffff" stroke="#2f855a" stroke-width="1.4"/><rect x="254.2" y="356" width="6" height="32" rx="3" fill="#2f855a"/><text class="sans" x="272.2" y="377.0" font-size="13" fill="#22643f" font-weight="600">Deterministic checks</text>
<rect x="444.4" y="356" width="141" height="32" rx="5" fill="#ffffff" stroke="#d4573a" stroke-width="1.4"/><rect x="444.4" y="356" width="6" height="32" rx="3" fill="#d4573a"/><text class="sans" x="462.4" y="377.0" font-size="13" fill="#a8412a" font-weight="600">Bounded retries</text>
<g transform="rotate(-2 800.0 231.0)"><rect x="650" y="56" width="300" height="350" rx="4" fill="#ffffff" stroke="#e7dcc6" filter="url(#lift)"/>
<text class="serif" x="800.0" y="90.0" font-size="13" fill="#1f2a44" font-weight="700" text-anchor="middle">Sparse Routing Transformers</text>
<text class="serif" x="800.0" y="107.0" font-size="10.5" fill="#5b6475" text-anchor="middle">for Long-Document Question Answering</text>
<line x1="674" y1="128" x2="926" y2="128" stroke="#d8d2c4" stroke-width="3" stroke-linecap="round"/>
<line x1="674" y1="139" x2="916" y2="139" stroke="#d8d2c4" stroke-width="3" stroke-linecap="round"/>
<line x1="674" y1="150" x2="923" y2="150" stroke="#d8d2c4" stroke-width="3" stroke-linecap="round"/>
<line x1="674" y1="161" x2="830" y2="161" stroke="#d8d2c4" stroke-width="3" stroke-linecap="round"/>
<text class="serif" x="674.0" y="188.0" font-size="12" fill="#1f2a44" font-weight="700">4.2  Main Results</text>
<text class="serif" x="674.0" y="206.0" font-size="9" fill="#5b6475" font-style="italic">Table 1: Main results on long-document QA.</text>
<line x1="674" y1="216" x2="926" y2="216" stroke="#1f2a44" stroke-width="1.2"/>
<text class="serif" x="676.0" y="231.0" font-size="9.4" fill="#1f2a44" font-weight="700">Model</text>
<text class="serif" x="855.4" y="231.0" font-size="9.4" fill="#1f2a44" font-weight="700" text-anchor="end">NQA F1</text>
<text class="serif" x="924.0" y="231.0" font-size="9.4" fill="#1f2a44" font-weight="700" text-anchor="end">QuALITY</text>
<line x1="674" y1="237" x2="926" y2="237" stroke="#1f2a44" stroke-width=".7"/>
<text class="serif" x="676.0" y="253.0" font-size="9.4" fill="#1f2a44">Dense-Large</text>
<text class="serif" x="855.4" y="253.0" font-size="9.4" fill="#1f2a44" text-anchor="end">76.2</text>
<text class="serif" x="924.0" y="253.0" font-size="9.4" fill="#1f2a44" text-anchor="end">61.4</text>
<text class="serif" x="676.0" y="274.0" font-size="9.4" fill="#1f2a44">Longformer-Large</text>
<text class="serif" x="855.4" y="274.0" font-size="9.4" fill="#1f2a44" text-anchor="end">77.9</text>
<text class="serif" x="924.0" y="274.0" font-size="9.4" fill="#1f2a44" text-anchor="end">63.0</text>
<text class="serif" x="676.0" y="295.0" font-size="9.4" fill="#1f2a44">BM25 + Reader</text>
<text class="serif" x="855.4" y="295.0" font-size="9.4" fill="#1f2a44" text-anchor="end">74.1</text>
<text class="serif" x="924.0" y="295.0" font-size="9.4" fill="#1f2a44" text-anchor="end">59.8</text>
<text class="serif" x="676.0" y="316.0" font-size="9.4" fill="#1f2a44">SRT-Base</text>
<text class="serif" x="855.4" y="316.0" font-size="9.4" fill="#1f2a44" text-anchor="end">79.3</text>
<text class="serif" x="924.0" y="316.0" font-size="9.4" fill="#1f2a44" text-anchor="end">65.1</text>
<rect class="glow" x="671" y="324" width="258" height="18" rx="3" fill="#fde68a"/>
<text class="serif" x="676.0" y="337.0" font-size="9.4" fill="#1f2a44" font-weight="700">SRT-Large</text>
<text class="serif" x="855.4" y="337.0" font-size="9.4" fill="#1f2a44" font-weight="700" text-anchor="end">81.4</text>
<text class="serif" x="924.0" y="337.0" font-size="9.4" fill="#1f2a44" font-weight="700" text-anchor="end">68.7</text>
<line x1="674" y1="345" x2="926" y2="345" stroke="#1f2a44" stroke-width="1.2"/>
<line x1="674" y1="363" x2="926" y2="363" stroke="#d8d2c4" stroke-width="3" stroke-linecap="round"/>
<line x1="674" y1="374" x2="901" y2="374" stroke="#d8d2c4" stroke-width="3" stroke-linecap="round"/>
<text class="serif" x="800.0" y="392.0" font-size="10" fill="#5b6475" text-anchor="middle">4</text></g>
<g transform="rotate(1.5 1092.0 243.0)"><rect x="958" y="118" width="268" height="250" rx="3" fill="#fffdf6" stroke="#e7dcc6" filter="url(#lift)"/>
<rect x="1058.0" y="109" width="68" height="18" rx="2" fill="#fde68a" fill-opacity=".85" transform="rotate(-3 1092.0 118)"/>
<g class="glow" transform="rotate(-8 1164 164)"><rect x="1108" y="148" width="104" height="32" rx="5" fill="none" stroke="#2f855a" stroke-width="2.4"/><text class="sans" x="1160.0" y="170.0" font-size="13.5" fill="#2f855a" font-weight="800" text-anchor="middle" letter-spacing="1.5">SUPPORTED</text></g>
<text class="serif" x="978.0" y="164.0" font-size="13" fill="#5b6475" font-weight="700" font-style="italic">Claim</text>
<text class="serif" x="978.0" y="210.0" font-size="18" fill="#1f2a44" font-weight="700">SRT-Large reaches</text>
<text class="serif" x="978.0" y="234.0" font-size="18" fill="#1f2a44" font-weight="700">81.4 F1 on NarrativeQA.</text>
<line x1="974" y1="283" x2="1210" y2="283" stroke="#e7dcc6"/>
<text class="serif" x="978.0" y="274.0" font-size="12" fill="#5b6475" font-style="italic">quote</text>
<text class="mono" x="1038.0" y="274.0" font-size="12" fill="#22643f" font-weight="600">found on the page</text>
<line x1="974" y1="311" x2="1210" y2="311" stroke="#e7dcc6"/>
<text class="serif" x="978.0" y="302.0" font-size="12" fill="#5b6475" font-style="italic">number</text>
<text class="mono" x="1038.0" y="302.0" font-size="12" fill="#22643f" font-weight="600">81.4 = 81.4</text>
<line x1="974" y1="339" x2="1210" y2="339" stroke="#e7dcc6"/>
<text class="serif" x="978.0" y="330.0" font-size="12" fill="#5b6475" font-style="italic">cite</text>
<text class="mono" x="1038.0" y="330.0" font-size="12" fill="#1f4f82" font-weight="600">[p. 4, §4.2, Table 1]</text></g>
<path class="ink" d="M935 328 C 959 338, 928 288, 968 300" fill="none" stroke="#d4573a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#aCoral)"/>
<text class="serif" x="1216.0" y="440.0" font-size="11" fill="#5b6475" text-anchor="end" font-style="italic">example from the bundled synthetic test paper</text>
</svg>