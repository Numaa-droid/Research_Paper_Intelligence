<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="t d">
  <title id="t">PaperMind: citation-grounded multi-agent analysis of research papers</title>
  <desc id="d">A research-paper page whose Table 1 row is cited by a supported claim: the quote was found on the page and the number matches its evidence.</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset=".45" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="gradH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="gradV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="gradC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <radialGradient id="glowV" cx=".08" cy="-.05" r=".7"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC" cx="1" cy=".1" r=".6"><stop offset="0" stop-color="#22d3ee" stop-opacity=".2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".07"/></pattern>
    <linearGradient id="fadeGrid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="gridMask"><rect width="1280" height="460" fill="url(#fadeGrid)"/></mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c4b5fd"/></marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f43f5e"/></marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .flow{stroke-dasharray:6 7;animation:flow 1.1s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-26}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
      @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
      .pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 2.8s ease-in-out infinite}
      @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
      @media (prefers-reduced-motion:reduce){.flow,.pulse,.grow,.pop{animation:none}}
    </style>
  </defs>
  <rect width="1280" height="460" rx="24" fill="#060a14"/>
  <rect width="1280" height="460" rx="24" fill="url(#glowV)"/>
  <rect width="1280" height="460" rx="24" fill="url(#glowC)"/>
  <rect width="1280" height="460" rx="24" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect x=".5" y=".5" width="1279" height="459" rx="24" fill="none" stroke="#94a3b8" stroke-opacity=".18"/>

<rect x="64" y="64" width="52" height="52" rx="14" fill="url(#grad)"/>
<path d="M76 72h20l9 9v29h-29z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M96 72v9h9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M82 87h16M82 94h16M82 101h10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="132.0" y="86.0" font-size="17" fill="#e7ecf6" font-weight="700" letter-spacing=".5">PaperMind</text>
<text class="sans" x="132.0" y="107.0" font-size="14" fill="#8d99b3">Citation-grounded analysis of research papers</text>
<text class="sans" x="64.0" y="190.0" font-size="52" fill="#e7ecf6" font-weight="800" letter-spacing="-1.5">Every claim, checked</text>
<text class="sans" x="64.0" y="250.0" font-size="52" fill="url(#gradH)" font-weight="800" letter-spacing="-1.5">against the page.</text>
<text class="sans" x="64.0" y="298.0" font-size="19" fill="#a9b4cc">Specialist agents read one research paper; a verifier</text>
<text class="sans" x="64.0" y="324.0" font-size="19" fill="#a9b4cc">re-checks every high-impact claim against the PDF.</text>
<rect x="64.0" y="358" width="186" height="34" rx="17.0" fill="#8b5cf6" fill-opacity=".13" stroke="#8b5cf6" stroke-opacity=".5"/><text class="sans" x="156.9" y="379.9" font-size="13.5" fill="#c4b5fd" font-weight="600" text-anchor="middle">Page-level citations</text>
<rect x="261.9" y="358" width="186" height="34" rx="17.0" fill="#22d3ee" fill-opacity=".13" stroke="#22d3ee" stroke-opacity=".5"/><text class="sans" x="354.8" y="379.9" font-size="13.5" fill="#67e8f9" font-weight="600" text-anchor="middle">Deterministic checks</text>
<rect x="459.8" y="358" width="147" height="34" rx="17.0" fill="#2dd4bf" fill-opacity=".13" stroke="#2dd4bf" stroke-opacity=".5"/><text class="sans" x="533.5" y="379.9" font-size="13.5" fill="#5eead4" font-weight="600" text-anchor="middle">Bounded retries</text>
<g filter="url(#shadow)"><rect x="672" y="66" width="262" height="330" rx="12" fill="#f8fafc"/></g>
<rect x="710" y="88" width="186" height="9" rx="4.5" fill="#cbd5e1"/>
<rect x="741" y="103" width="124" height="7" rx="3.5" fill="#e2e8f0"/>
<rect x="692" y="126" width="215" height="6" rx="3" fill="#e2e8f0"/>
<rect x="692" y="138" width="204" height="6" rx="3" fill="#e2e8f0"/>
<rect x="692" y="150" width="211" height="6" rx="3" fill="#e2e8f0"/>
<rect x="692" y="162" width="155" height="6" rx="3" fill="#e2e8f0"/>
<text class="sans" x="692.0" y="194.0" font-size="11.5" fill="#334155" font-weight="800">4.2  Main Results</text>
<text class="sans" x="692.0" y="212.0" font-size="8.6" fill="#64748b" font-style="italic">Table 1: Main results on long-document QA.</text>
<rect x="692" y="222" width="222" height="22" fill="#eef2ff"/>
<text class="sans" x="698.0" y="237.0" font-size="9.2" fill="#475569" font-weight="700">Model</text>
<text class="sans" x="847.4" y="237.0" font-size="9.2" fill="#475569" font-weight="700" text-anchor="end">NQA F1</text>
<text class="sans" x="908.0" y="237.0" font-size="9.2" fill="#475569" font-weight="700" text-anchor="end">QuALITY</text>
<text class="sans" x="698.0" y="259.0" font-size="9.2" fill="#334155">Dense-Large</text>
<text class="sans" x="847.4" y="259.0" font-size="9.2" fill="#334155" text-anchor="end">76.2</text>
<text class="sans" x="908.0" y="259.0" font-size="9.2" fill="#334155" text-anchor="end">61.4</text>
<line x1="692" y1="266" x2="914" y2="266" stroke="#eef2f7"/>
<text class="sans" x="698.0" y="281.0" font-size="9.2" fill="#334155">Longformer-Large</text>
<text class="sans" x="847.4" y="281.0" font-size="9.2" fill="#334155" text-anchor="end">77.9</text>
<text class="sans" x="908.0" y="281.0" font-size="9.2" fill="#334155" text-anchor="end">63.0</text>
<line x1="692" y1="288" x2="914" y2="288" stroke="#eef2f7"/>
<text class="sans" x="698.0" y="303.0" font-size="9.2" fill="#334155">BM25 + Reader</text>
<text class="sans" x="847.4" y="303.0" font-size="9.2" fill="#334155" text-anchor="end">74.1</text>
<text class="sans" x="908.0" y="303.0" font-size="9.2" fill="#334155" text-anchor="end">59.8</text>
<line x1="692" y1="310" x2="914" y2="310" stroke="#eef2f7"/>
<text class="sans" x="698.0" y="325.0" font-size="9.2" fill="#334155">SRT-Base</text>
<text class="sans" x="847.4" y="325.0" font-size="9.2" fill="#334155" text-anchor="end">79.3</text>
<text class="sans" x="908.0" y="325.0" font-size="9.2" fill="#334155" text-anchor="end">65.1</text>
<line x1="692" y1="332" x2="914" y2="332" stroke="#eef2f7"/>
<rect class="pulse" x="688" y="333" width="230" height="21" rx="4" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-width="1.6" stroke-dasharray="4 3"/>
<text class="sans" x="698.0" y="347.0" font-size="9.2" fill="#334155" font-weight="700">SRT-Large</text>
<text class="sans" x="847.4" y="347.0" font-size="9.2" fill="#0f172a" font-weight="700" text-anchor="end">81.4</text>
<text class="sans" x="908.0" y="347.0" font-size="9.2" fill="#334155" font-weight="700" text-anchor="end">68.7</text>
<line x1="692" y1="354" x2="914" y2="354" stroke="#eef2f7"/>
<text class="sans" x="914.0" y="384.0" font-size="9.5" fill="#94a3b8" text-anchor="end">p. 4</text>
<rect x="970" y="92" width="250" height="286" rx="16" fill="#0d1424" stroke="#94a3b8" stroke-opacity=".22" filter="url(#shadow)"/>
<text class="sans" x="990.0" y="124.0" font-size="11" fill="#8d99b3" font-weight="700" letter-spacing="1.4">CLAIM</text>
<g class="pop"><rect x="1102" y="107" width="102" height="25" rx="12.5" fill="#22c55e" fill-opacity=".15" stroke="#22c55e" stroke-opacity=".55"/><text class="sans" x="1153.0" y="124.0" font-size="11" fill="#86efac" font-weight="700" text-anchor="middle" letter-spacing=".6">✓ SUPPORTED</text></g>
<text class="sans" x="990.0" y="164.0" font-size="21" fill="#e7ecf6" font-weight="800">SRT-Large reaches</text>
<text class="sans" x="990.0" y="191.0" font-size="19" fill="url(#gradH)" font-weight="800">81.4 F1 on NarrativeQA</text>
<line x1="990" y1="210" x2="1200" y2="210" stroke="#94a3b8" stroke-opacity=".2"/>
<text class="sans" x="990.0" y="236.0" font-size="10.5" fill="#8d99b3" font-weight="700" letter-spacing="1.2">QUOTE</text>
<text class="mono" x="990.0" y="256.0" font-size="12.5" fill="#c4b5fd">found on the page · exact</text>
<text class="sans" x="990.0" y="282.0" font-size="10.5" fill="#8d99b3" font-weight="700" letter-spacing="1.2">NUMBER</text>
<text class="mono" x="990.0" y="302.0" font-size="12.5" fill="#67e8f9">81.4 = 81.4 in the evidence</text>
<text class="sans" x="990.0" y="328.0" font-size="10.5" fill="#8d99b3" font-weight="700" letter-spacing="1.2">CITATION</text>
<text class="mono" x="990.0" y="348.0" font-size="12.5" fill="#5eead4">[p. 4, §4.2, Table 1]</text>
