<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d">
  <title id="t">How PaperMind analyses a paper</title>
  <desc id="d">Six steps: ingest and index the PDF, then plan, analyse with specialist agents, verify and report. Agents whose claims fail to ground are retried a limited number of times.</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset=".45" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="gradH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="gradV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="gradC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
    <radialGradient id="glowV" cx=".08" cy="-.05" r=".7"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowC" cx="1" cy=".1" r=".6"><stop offset="0" stop-color="#22d3ee" stop-opacity=".2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".07"/></pattern>
    <linearGradient id="fadeGrid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="gridMask"><rect width="1280" height="560" fill="url(#fadeGrid)"/></mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".5"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
    <marker id="arrowV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c4b5fd"/></marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f43f5e"/></marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22c55e"/></marker>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .flow{stroke-dasharray:6 7;animation:flow 1.1s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-26}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
      @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
      .pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 2.8s ease-in-out infinite}
      @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
      @media (prefers-reduced-motion:reduce){.flow,.pulse,.grow,.pop{animation:none}}
    </style>
  </defs>
  <rect width="1280" height="560" rx="24" fill="#060a14"/>
  <rect width="1280" height="560" rx="24" fill="url(#glowV)"/>
  <rect width="1280" height="560" rx="24" fill="url(#glowC)"/>
  <rect width="1280" height="560" rx="24" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect x=".5" y=".5" width="1279" height="559" rx="24" fill="none" stroke="#94a3b8" stroke-opacity=".18"/>

<text class="sans" x="48.0" y="70.0" font-size="30" fill="#e7ecf6" font-weight="800" letter-spacing="-.6">How PaperMind analyses a paper</text><text class="sans" x="48.0" y="100.0" font-size="15.5" fill="#8d99b3">The PDF is indexed once, page by page. Then a planned team of agents analyses it, and nothing is cited unchecked.</text>
<text class="sans" x="48.0" y="160.0" font-size="12" fill="#67e8f9" font-weight="700" letter-spacing="1.3">PREPARE THE PAPER · once per PDF</text>
<line x1="48" y1="171" x2="422" y2="171" stroke="#22d3ee" stroke-opacity=".45"/>
<text class="sans" x="452.0" y="160.0" font-size="12" fill="#c4b5fd" font-weight="700" letter-spacing="1.3">ANALYSE · a typed state graph of agents</text>
<line x1="452" y1="171" x2="1232" y2="171" stroke="#8b5cf6" stroke-opacity=".55"/>
<rect x="48" y="186" width="172" height="214" rx="16" fill="#0d1424" stroke="#22d3ee" stroke-opacity=".35" filter="url(#shadow)"/>
<circle cx="74" cy="214" r="13" fill="url(#grad)"/>
<text class="sans" x="74.0" y="219.0" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">1</text>
<rect x="148" y="202" width="56" height="56" rx="14" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><path d="M163.0 212.0h17l9 9v27h-26z" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M180.0 212.0v9h9" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M175.5 242.0v-14M170.0 233.0l5.5-5.5 5.5 5.5" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="64.0" y="302.0" font-size="17" fill="#e7ecf6" font-weight="800">Ingest</text>
<text class="sans" x="64.0" y="328.0" font-size="12.5" fill="#a9b4cc">PDF parsed page by</text>
<text class="sans" x="64.0" y="347.0" font-size="12.5" fill="#a9b4cc">page; OCR fallback</text>
<text class="sans" x="64.0" y="366.0" font-size="12.5" fill="#a9b4cc">for scanned pages</text>
<path class="flow" d="M223 293.0 H247" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="250" y="186" width="172" height="214" rx="16" fill="#0d1424" stroke="#22d3ee" stroke-opacity=".35" filter="url(#shadow)"/>
<circle cx="276" cy="214" r="13" fill="url(#grad)"/>
<text class="sans" x="276.0" y="219.0" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">2</text>
<rect x="350" y="202" width="56" height="56" rx="14" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".45"/><circle cx="375.0" cy="227.0" r="12" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M384.0 236.0l9 9" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M369.0 227.0h12M369.0 232.0h8" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="266.0" y="302.0" font-size="17" fill="#e7ecf6" font-weight="800">Index</text>
<text class="sans" x="266.0" y="328.0" font-size="12.5" fill="#a9b4cc">Page-aware chunks;</text>
<text class="sans" x="266.0" y="347.0" font-size="12.5" fill="#a9b4cc">BM25 + dense search</text>
<text class="sans" x="266.0" y="366.0" font-size="12.5" fill="#a9b4cc">fused with RRF</text>
<path class="flow" d="M425 293.0 H449" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="452" y="186" width="172" height="214" rx="16" fill="#0d1424" stroke="#c4b5fd" stroke-opacity=".35" filter="url(#shadow)"/>
<circle cx="478" cy="214" r="13" fill="url(#grad)"/>
<text class="sans" x="478.0" y="219.0" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">3</text>
<rect x="552" y="202" width="56" height="56" rx="14" fill="#c4b5fd" fill-opacity=".12" stroke="#c4b5fd" stroke-opacity=".45"/><rect x="574.0" y="211.0" width="12" height="10" rx="2" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="560.0" y="239.0" width="12" height="10" rx="2" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="574.0" y="239.0" width="12" height="10" rx="2" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="588.0" y="239.0" width="12" height="10" rx="2" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M580.0 221.0v18M580.0 230.0h-14v9M580.0 230.0h14v9" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="468.0" y="302.0" font-size="17" fill="#e7ecf6" font-weight="800">Plan</text>
<text class="sans" x="468.0" y="328.0" font-size="12.5" fill="#a9b4cc">Planner picks the</text>
<text class="sans" x="468.0" y="347.0" font-size="12.5" fill="#a9b4cc">specialists this</text>
<text class="sans" x="468.0" y="366.0" font-size="12.5" fill="#a9b4cc">paper needs, and why</text>
<path class="flow" d="M627 293.0 H651" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="654" y="186" width="172" height="214" rx="16" fill="#0d1424" stroke="#c4b5fd" stroke-opacity=".35" filter="url(#shadow)"/>
<circle cx="680" cy="214" r="13" fill="url(#grad)"/>
<text class="sans" x="680.0" y="219.0" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">4</text>
<rect x="754" y="202" width="56" height="56" rx="14" fill="#c4b5fd" fill-opacity=".12" stroke="#c4b5fd" stroke-opacity=".45"/><polygon points="798.5,239.5 782.0,249.0 765.5,239.5 765.5,220.5 782.0,211.0 798.5,220.5" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="782.0" cy="230.0" r="5" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="670.0" y="302.0" font-size="17" fill="#e7ecf6" font-weight="800">Analyse</text>
<text class="sans" x="670.0" y="328.0" font-size="12.5" fill="#a9b4cc">Specialists run in</text>
<text class="sans" x="670.0" y="347.0" font-size="12.5" fill="#a9b4cc">parallel, each on its</text>
<text class="sans" x="670.0" y="366.0" font-size="12.5" fill="#a9b4cc">own targeted evidence</text>
<path class="flow" d="M829 293.0 H853" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="856" y="186" width="172" height="214" rx="16" fill="#0d1424" stroke="#22c55e" stroke-opacity=".35" filter="url(#shadow)"/>
<circle cx="882" cy="214" r="13" fill="url(#grad)"/>
<text class="sans" x="882.0" y="219.0" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">5</text>
<rect x="956" y="202" width="56" height="56" rx="14" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".45"/><path d="M984.0 211.0l15 5v11c0 10-6.5 16.5-15 20c-8.5-3.5-15-10-15-20v-11z" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M977.0 230.0l5 5l9-10" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="872.0" y="302.0" font-size="17" fill="#e7ecf6" font-weight="800">Verify</text>
<text class="sans" x="872.0" y="328.0" font-size="12.5" fill="#a9b4cc">Evidence re-retrieved</text>
<text class="sans" x="872.0" y="347.0" font-size="12.5" fill="#a9b4cc">independently; code</text>
<text class="sans" x="872.0" y="366.0" font-size="12.5" fill="#a9b4cc">checks quotes + numbers</text>
<path class="flow" d="M1031 293.0 H1055" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
<rect x="1058" y="186" width="172" height="214" rx="16" fill="#0d1424" stroke="#f59e0b" stroke-opacity=".35" filter="url(#shadow)"/>
<circle cx="1084" cy="214" r="13" fill="url(#grad)"/>
<text class="sans" x="1084.0" y="219.0" font-size="13" fill="#fff" font-weight="800" text-anchor="middle">6</text>
<rect x="1158" y="202" width="56" height="56" rx="14" fill="#f59e0b" fill-opacity=".12" stroke="#f59e0b" stroke-opacity=".45"/><path d="M1172.0 211.0h28v38h-28z" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1178.0 221.0l2.5 2.5 4-4M1187.0 222.0h7M1178.0 231.0l2.5 2.5 4-4M1187.0 232.0h7M1178.0 242.0h16" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sans" x="1074.0" y="302.0" font-size="17" fill="#e7ecf6" font-weight="800">Report</text>
<text class="sans" x="1074.0" y="328.0" font-size="12.5" fill="#a9b4cc">Built from validated</text>
<text class="sans" x="1074.0" y="347.0" font-size="12.5" fill="#a9b4cc">findings, no model</text>
<text class="sans" x="1074.0" y="366.0" font-size="12.5" fill="#a9b4cc">call; gaps labelled</text>
<path class="flow" d="M942.0 402 C 942.0 464, 740.0 464, 740.0 410" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowR)"/>
<text class="sans" x="841.0" y="478.0" font-size="12.5" fill="#fda4af" font-weight="600" text-anchor="middle">claims below the threshold → only those agents retried, with feedback (bounded)</text>
<text class="sans" x="235.0" y="442.0" font-size="12.5" fill="#67e8f9" font-weight="600" text-anchor="middle">a chunk never crosses a page boundary</text>
<text class="sans" x="48.0" y="527.0" font-size="11" fill="#8d99b3" font-weight="700" letter-spacing="1.4">BUILT WITH</text>
<rect x="140.0" y="508" width="94" height="28" rx="14.0" fill="#94a3b8" fill-opacity=".13" stroke="#94a3b8" stroke-opacity=".5"/><text class="sans" x="187.0" y="526.3" font-size="12" fill="#cbd5e1" text-anchor="middle">Python 3.11</text>
<rect x="244.0" y="508" width="69" height="28" rx="14.0" fill="#94a3b8" fill-opacity=".13" stroke="#94a3b8" stroke-opacity=".5"/><text class="sans" x="278.2" y="526.3" font-size="12" fill="#cbd5e1" text-anchor="middle">FastAPI</text>
<rect x="322.5" y="508" width="94" height="28" rx="14.0" fill="#94a3b8" fill-opacity=".13" stroke="#94a3b8" stroke-opacity=".5"/><text class="sans" x="369.5" y="526.3" font-size="12" fill="#cbd5e1" text-anchor="middle">Pydantic v2</text>
<rect x="426.4" y="508" width="69" height="28" rx="14.0" fill="#94a3b8" fill-opacity=".13" stroke="#94a3b8" stroke-opacity=".5"/><text class="sans" x="460.7" y="526.3" font-size="12" fill="#cbd5e1" text-anchor="middle">PyMuPDF</text>
<rect x="505.0" y="508" width="100" height="28" rx="14.0" fill="#94a3b8" fill-opacity=".13" stroke="#94a3b8" stroke-opacity=".5"/><text class="sans" x="555.1" y="526.3" font-size="12" fill="#cbd5e1" text-anchor="middle">PP-Structure</text>
<rect x="615.3" y="508" width="100" height="28" rx="14.0" fill="#94a3b8" fill-opacity=".13" stroke="#94a3b8" stroke-opacity=".5"/><text class="sans" x="665.4" y="526.3" font-size="12" fill="#cbd5e1" text-anchor="middle">PaddleOCR-VL</text>
<rect x="725.6" y="508" width="100" height="28" rx="14.0" fill="#94a3b8" fill-opacity=".13" stroke="#94a3b8" stroke-opacity=".5"/><text class="sans" x="775.8" y="526.3" font-size="12" fill="#cbd5e1" text-anchor="middle">BM25 + dense</text>
<rect x="835.9" y="508" width="164" height="28" rx="14.0" fill="#94a3b8" fill-opacity=".13" stroke="#94a3b8" stroke-opacity=".5"/><text class="sans" x="917.9" y="526.3" font-size="12" fill="#cbd5e1" text-anchor="middle">OpenAI-compatible LLMs</text>
