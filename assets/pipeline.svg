<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="t d">
  <title id="t">How PaperMind analyses a paper</title>
  <desc id="d">A line with six stations: ingest and index the PDF once, then plan, analyse with specialist agents, verify and report. Agents whose claims fail to ground loop back for a limited number of retries.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#c9b98f" fill-opacity=".45"/></pattern>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#5c4a24" flood-opacity=".18"/></filter>
    <marker id="aInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2a44"/></marker>
    <marker id="aCoral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d4573a"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f855a"/></marker>
    <style>
      .serif{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .ink{stroke-dasharray:7 6;animation:ink 1.4s linear infinite}
      @keyframes ink{to{stroke-dashoffset:-26}}
      .glow{animation:glow 2.6s ease-in-out infinite}
      @keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.ink,.glow{animation:none}}
    </style>
  </defs>
  <rect width="1280" height="540" rx="18" fill="#fbf7ef"/>
  <rect width="1280" height="540" rx="18" fill="url(#dots)"/>
  <rect x="1" y="1" width="1278" height="538" rx="17" fill="none" stroke="#e7dcc6" stroke-width="2"/>

<text class="serif" x="56.0" y="74.0" font-size="32" fill="#1f2a44" font-weight="700" letter-spacing="-.3">How PaperMind analyses a paper</text><rect x="56" y="86" width="56" height="4" rx="2" fill="#d4573a"/><text class="sans" x="56.0" y="116.0" font-size="15.5" fill="#5b6475">The PDF is indexed once, page by page. Then a planned team of agents analyses it; nothing is cited unchecked.</text>
<path d="M90 176 v-8 H390 v8" fill="none" stroke="#2b6cb0" stroke-width="1.6"/>
<text class="sans" x="240.0" y="158.0" font-size="12" fill="#1f4f82" font-weight="700" text-anchor="middle" letter-spacing="1.6">PREPARE THE PAPER  ·  once per PDF</text>
<path d="M490 176 v-8 H1190 v8" fill="none" stroke="#d4573a" stroke-width="1.6"/>
<text class="sans" x="840.0" y="158.0" font-size="12" fill="#a8412a" font-weight="700" text-anchor="middle" letter-spacing="1.6">ANALYSE  ·  a typed state graph of agents</text>
<line x1="80" y1="268" x2="440" y2="268" stroke="#2b6cb0" stroke-width="8" stroke-linecap="round"/>
<line x1="440" y1="268" x2="1200" y2="268" stroke="#d4573a" stroke-width="8" stroke-linecap="round"/>
<line class="ink" x1="80" y1="268" x2="1200" y2="268" stroke="#fff" stroke-width="2" stroke-opacity=".8"/>
<text class="serif" x="140.0" y="224.0" font-size="21" fill="#1f2a44" font-weight="700" text-anchor="middle">Ingest</text>
<circle cx="140" cy="268" r="24" fill="#ffffff" stroke="#2b6cb0" stroke-width="5"/>
<text class="serif" x="140.0" y="275.0" font-size="20" fill="#1f4f82" font-weight="700" text-anchor="middle">1</text>
<text class="sans" x="140.0" y="328.0" font-size="13.5" fill="#5b6475" text-anchor="middle">PDF parsed page by</text>
<text class="sans" x="140.0" y="347.0" font-size="13.5" fill="#5b6475" text-anchor="middle">page; OCR fallback</text>
<text class="sans" x="140.0" y="366.0" font-size="13.5" fill="#5b6475" text-anchor="middle">for scanned pages</text>
<text class="serif" x="340.0" y="224.0" font-size="21" fill="#1f2a44" font-weight="700" text-anchor="middle">Index</text>
<circle cx="340" cy="268" r="24" fill="#ffffff" stroke="#2b6cb0" stroke-width="5"/>
<text class="serif" x="340.0" y="275.0" font-size="20" fill="#1f4f82" font-weight="700" text-anchor="middle">2</text>
<text class="sans" x="340.0" y="328.0" font-size="13.5" fill="#5b6475" text-anchor="middle">page-aware chunks;</text>
<text class="sans" x="340.0" y="347.0" font-size="13.5" fill="#5b6475" text-anchor="middle">BM25 + dense search</text>
<text class="sans" x="340.0" y="366.0" font-size="13.5" fill="#5b6475" text-anchor="middle">fused with RRF</text>
<text class="serif" x="540.0" y="224.0" font-size="21" fill="#1f2a44" font-weight="700" text-anchor="middle">Plan</text>
<circle cx="540" cy="268" r="24" fill="#ffffff" stroke="#d4573a" stroke-width="5"/>
<text class="serif" x="540.0" y="275.0" font-size="20" fill="#a8412a" font-weight="700" text-anchor="middle">3</text>
<text class="sans" x="540.0" y="328.0" font-size="13.5" fill="#5b6475" text-anchor="middle">the planner picks</text>
<text class="sans" x="540.0" y="347.0" font-size="13.5" fill="#5b6475" text-anchor="middle">the specialists this</text>
<text class="sans" x="540.0" y="366.0" font-size="13.5" fill="#5b6475" text-anchor="middle">paper needs, and why</text>
<text class="serif" x="740.0" y="224.0" font-size="21" fill="#1f2a44" font-weight="700" text-anchor="middle">Analyse</text>
<circle cx="740" cy="268" r="24" fill="#ffffff" stroke="#d4573a" stroke-width="5"/>
<text class="serif" x="740.0" y="275.0" font-size="20" fill="#a8412a" font-weight="700" text-anchor="middle">4</text>
<text class="sans" x="740.0" y="328.0" font-size="13.5" fill="#5b6475" text-anchor="middle">specialists run in</text>
<text class="sans" x="740.0" y="347.0" font-size="13.5" fill="#5b6475" text-anchor="middle">parallel, each on its</text>
<text class="sans" x="740.0" y="366.0" font-size="13.5" fill="#5b6475" text-anchor="middle">own targeted evidence</text>
<text class="serif" x="940.0" y="224.0" font-size="21" fill="#1f2a44" font-weight="700" text-anchor="middle">Verify</text>
<circle cx="940" cy="268" r="24" fill="#ffffff" stroke="#2f855a" stroke-width="5"/>
<text class="serif" x="940.0" y="275.0" font-size="20" fill="#22643f" font-weight="700" text-anchor="middle">5</text>
<text class="sans" x="940.0" y="328.0" font-size="13.5" fill="#5b6475" text-anchor="middle">evidence re-retrieved</text>
<text class="sans" x="940.0" y="347.0" font-size="13.5" fill="#5b6475" text-anchor="middle">independently; code</text>
<text class="sans" x="940.0" y="366.0" font-size="13.5" fill="#5b6475" text-anchor="middle">checks quotes, numbers</text>
<text class="serif" x="1140.0" y="224.0" font-size="21" fill="#1f2a44" font-weight="700" text-anchor="middle">Report</text>
<circle cx="1140" cy="268" r="24" fill="#ffffff" stroke="#c98a12" stroke-width="5"/>
<text class="serif" x="1140.0" y="275.0" font-size="20" fill="#8f6209" font-weight="700" text-anchor="middle">6</text>
<text class="sans" x="1140.0" y="328.0" font-size="13.5" fill="#5b6475" text-anchor="middle">built from validated</text>
<text class="sans" x="1140.0" y="347.0" font-size="13.5" fill="#5b6475" text-anchor="middle">findings, no model</text>
<text class="sans" x="1140.0" y="366.0" font-size="13.5" fill="#5b6475" text-anchor="middle">call; gaps labelled</text>
<path class="ink" d="M940 392 C 940 448, 740 448, 740 398" fill="none" stroke="#d4573a" stroke-width="2.2" marker-end="url(#aCoral)"/>
<text class="serif" x="840.0" y="466.0" font-size="13" fill="#a8412a" font-weight="600" text-anchor="middle" font-style="italic">claims below the threshold: only those agents re-run, with feedback (bounded)</text>
<text class="serif" x="240.0" y="422.0" font-size="13" fill="#1f4f82" font-weight="600" text-anchor="middle" font-style="italic">a chunk never crosses a page boundary</text>
<line x1="56" y1="482" x2="1224" y2="482" stroke="#e7dcc6" stroke-width="1.5"/>
<text class="serif" x="56.0" y="510.0" font-size="13" fill="#1f2a44" font-weight="700" font-style="italic">Built with</text>
<text class="mono" x="140.0" y="510.0" font-size="13" fill="#5b6475">Python 3.11 · FastAPI · Pydantic v2 · PyMuPDF · PP-Structure · PaddleOCR-VL · BM25 + dense retrieval · OpenAI-compatible LLMs</text>
</svg>