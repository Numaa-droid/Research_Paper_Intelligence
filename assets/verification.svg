<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="t d">
  <title id="t">How a claim earns a citation</title>
  <desc id="d">A claim from an agent is re-checked by code: page in range, quote present, section resolves, numbers match. Quotes match exactly, after normalising, approximately (labelled), or not at all; an unverifiable quote is never shown as a citation but kept in the evidence appendix.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#c9b98f" fill-opacity=".45"/></pattern>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#5c4a24" flood-opacity=".18"/></filter>
    <marker id="aInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2a44"/></marker>
    <marker id="aCoral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d4573a"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f855a"/></marker>
    <style>
      .serif{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .ink{stroke-dasharray:7 6;animation:ink 1.4s linear infinite}
      @keyframes ink{to{stroke-dashoffset:-26}}
      .glow{animation:glow 2.6s ease-in-out infinite}
      @keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.ink,.glow{animation:none}}
    </style>
  </defs>
  <rect width="1280" height="560" rx="18" fill="#fbf7ef"/>
  <rect width="1280" height="560" rx="18" fill="url(#dots)"/>
  <rect x="1" y="1" width="1278" height="558" rx="17" fill="none" stroke="#e7dcc6" stroke-width="2"/>

<text class="serif" x="56.0" y="74.0" font-size="32" fill="#1f2a44" font-weight="700" letter-spacing="-.3">How a claim earns a citation</text><rect x="56" y="86" width="56" height="4" rx="2" fill="#d4573a"/><text class="sans" x="56.0" y="116.0" font-size="15.5" fill="#5b6475">A citation appears only when its quote was found at the cited place. Failures are labelled, never hidden.</text>
<rect x="56" y="164" width="330" height="270" rx="4" fill="#ffffff" stroke="#e7dcc6" filter="url(#lift)" transform="rotate(-1.5 221.0 299.0)"/>
<text class="sans" x="78.0" y="204.0" font-size="12.5" fill="#1f4f82" font-weight="700" letter-spacing="1">1 · AN AGENT CLAIMS</text>
<text class="serif" x="74.0" y="272.0" font-size="70" fill="#2b6cb0" font-weight="700" fill-opacity=".35">“</text>
<text class="serif" x="112.0" y="256.0" font-size="20" fill="#1f2a44" font-weight="700">SRT-Large reaches</text>
<text class="serif" x="112.0" y="282.0" font-size="20" fill="#1f2a44" font-weight="700">81.4 F1 on NarrativeQA.”</text>
<line x1="78" y1="310" x2="364" y2="310" stroke="#e7dcc6"/>
<text class="mono" x="78.0" y="336.0" font-size="12.5" fill="#1f4f82" font-weight="600">cites [S3] → p. 4, §4.2, Table 1</text>
<text class="serif" x="78.0" y="376.0" font-size="13.5" fill="#5b6475" font-style="italic">The verifier then fetches its own</text>
<text class="serif" x="78.0" y="396.0" font-size="13.5" fill="#5b6475" font-style="italic">evidence, not the agent's.</text>
<rect x="450" y="164" width="370" height="270" rx="4" fill="#fffdf6" stroke="#e7dcc6" filter="url(#lift)"/>
<line x1="494" y1="164" x2="494" y2="434" stroke="#d4573a" stroke-opacity=".45"/>
<text class="sans" x="510.0" y="200.0" font-size="12.5" fill="#22643f" font-weight="700" letter-spacing="1">2 · CHECKED BY CODE</text>
<line x1="450" y1="256" x2="820" y2="256" stroke="#2b6cb0" stroke-opacity=".22"/>
<rect x="510" y="232" width="17" height="17" rx="3" fill="#ffffff" stroke="#2f855a" stroke-width="1.8"/>
<path d="M513 240l4 4 8-10" fill="none" stroke="#2f855a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="serif" x="538.0" y="246.0" font-size="14.5" fill="#1f2a44">page is inside the PDF</text>
<line x1="450" y1="290" x2="820" y2="290" stroke="#2b6cb0" stroke-opacity=".22"/>
<rect x="510" y="266" width="17" height="17" rx="3" fill="#ffffff" stroke="#2f855a" stroke-width="1.8"/>
<path d="M513 274l4 4 8-10" fill="none" stroke="#2f855a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="serif" x="538.0" y="280.0" font-size="14.5" fill="#1f2a44">quote occurs in the cited text</text>
<line x1="450" y1="324" x2="820" y2="324" stroke="#2b6cb0" stroke-opacity=".22"/>
<rect x="510" y="300" width="17" height="17" rx="3" fill="#ffffff" stroke="#2f855a" stroke-width="1.8"/>
<path d="M513 308l4 4 8-10" fill="none" stroke="#2f855a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="serif" x="538.0" y="314.0" font-size="14.5" fill="#1f2a44">section resolves in the index</text>
<line x1="450" y1="358" x2="820" y2="358" stroke="#2b6cb0" stroke-opacity=".22"/>
<rect x="510" y="334" width="17" height="17" rx="3" fill="#ffffff" stroke="#2f855a" stroke-width="1.8"/>
<path d="M513 342l4 4 8-10" fill="none" stroke="#2f855a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="serif" x="538.0" y="348.0" font-size="14.5" fill="#1f2a44">numbers match their evidence</text>
<line x1="450" y1="392" x2="820" y2="392" stroke="#2b6cb0" stroke-opacity=".22"/>
<rect x="510" y="368" width="17" height="17" rx="3" fill="#ffffff" stroke="#2f855a" stroke-width="1.8"/>
<path d="M513 376l4 4 8-10" fill="none" stroke="#2f855a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="serif" x="538.0" y="382.0" font-size="14.5" fill="#1f2a44">fields and confidence are valid</text>
<text class="sans" x="510.0" y="414.0" font-size="12.5" fill="#22643f" font-weight="600">Code can lower the model's verdict, never raise it.</text>
<text class="sans" x="884.0" y="168.0" font-size="12.5" fill="#8f6209" font-weight="700" letter-spacing="1">3 · HOW WELL THE QUOTE MATCHED</text>
<rect x="884" y="232" width="82" height="182" rx="3" fill="#dcefe3" stroke="#2f855a" stroke-width="1.6"/>
<text class="serif" x="925.0" y="208.0" font-size="13" fill="#1f2a44" font-weight="700" text-anchor="middle">exact</text>
<text class="sans" x="925.0" y="224.0" font-size="11.5" fill="#22643f" font-weight="600" text-anchor="middle">cited</text>
<rect x="972" y="272" width="82" height="142" rx="3" fill="#dcefe3" stroke="#2f855a" stroke-width="1.6"/>
<text class="serif" x="1013.0" y="248.0" font-size="13" fill="#1f2a44" font-weight="700" text-anchor="middle">normalised</text>
<text class="sans" x="1013.0" y="264.0" font-size="11.5" fill="#22643f" font-weight="600" text-anchor="middle">cited</text>
<rect x="1060" y="318" width="82" height="96" rx="3" fill="#f8ecc9" stroke="#c98a12" stroke-width="1.6"/>
<text class="serif" x="1101.0" y="294.0" font-size="13" fill="#1f2a44" font-weight="700" text-anchor="middle">approximate</text>
<text class="sans" x="1101.0" y="310.0" font-size="11.5" fill="#8f6209" font-weight="600" text-anchor="middle">labelled</text>
<rect x="1148" y="374" width="82" height="40" rx="3" fill="#fbe4dc" stroke="#d4573a" stroke-width="1.6"/>
<text class="serif" x="1189.0" y="350.0" font-size="13" fill="#1f2a44" font-weight="700" text-anchor="middle">unverifiable</text>
<text class="sans" x="1189.0" y="366.0" font-size="11.5" fill="#a8412a" font-weight="600" text-anchor="middle">not cited</text>
<line x1="878" y1="414" x2="1236" y2="414" stroke="#1f2a44" stroke-width="1.6"/>
<text class="serif" x="884.0" y="436.0" font-size="12" fill="#5b6475" font-style="italic">step height = confidence kept</text>
<path class="ink" d="M394 294 H438" stroke="#1f2a44" stroke-width="2" marker-end="url(#aInk)"/>
<path class="ink" d="M828 294 H868" stroke="#1f2a44" stroke-width="2" marker-end="url(#aInk)"/>
<g transform="rotate(-3 180 508)"><rect x="60" y="488" width="244" height="40" rx="4" fill="none" stroke="#d4573a" stroke-width="2.4"/><text class="sans" x="182.0" y="514.0" font-size="14" fill="#d4573a" font-weight="800" text-anchor="middle" letter-spacing="1.6">ANNOTATE &amp; DOWNGRADE</text></g>
<text class="serif" x="330.0" y="514.0" font-size="15" fill="#1f2a44">A citation that fails is never silently deleted: it stays in the evidence appendix, marked unverifiable.</text>
</svg>