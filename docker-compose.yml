# Local stack: the API plus a persistent data volume.
#
#   docker compose up --build
#   open http://localhost:8000
#
# By default this runs the deterministic mock provider, which needs no
# credentials. Put real settings in a .env file (never commit it) to use a model.

services:
  paperpilot:
    build:
      context: .
      args:
        # Must include "embeddings" when PAPERPILOT_EMBEDDING_PROVIDER is
        # sentence_transformers, "layout" for PP-Structure, and so on.
        PAPERPILOT_EXTRAS: ${PAPERPILOT_EXTRAS:-ocr}
    image: paperpilot:latest
    ports:
      - "8000:8000"
    environment:
      # Override these in .env for a real analysis.
      PAPERPILOT_LLM_PROVIDER: ${PAPERPILOT_LLM_PROVIDER:-mock}
      PAPERPILOT_LLM_MODEL: ${PAPERPILOT_LLM_MODEL:-gpt-4o-mini}
      PAPERPILOT_LLM_BASE_URL: ${PAPERPILOT_LLM_BASE_URL:-https://api.openai.com/v1}
      PAPERPILOT_LLM_API_KEY: ${PAPERPILOT_LLM_API_KEY:-}
      PAPERPILOT_EMBEDDING_PROVIDER: ${PAPERPILOT_EMBEDDING_PROVIDER:-hashing}
      PAPERPILOT_LOG_LEVEL: ${PAPERPILOT_LOG_LEVEL:-INFO}
      PAPERPILOT_MAX_UPLOAD_MB: ${PAPERPILOT_MAX_UPLOAD_MB:-50}
      # Pin storage to the volume: a relative data dir in .env (for non-Docker
      # runs) would otherwise put uploads and the database in the container's
      # writable layer, lost whenever it is recreated.
      PAPERPILOT_DATA_DIR: /data
      PAPERPILOT_DATABASE_URL: sqlite:////data/paperpilot.sqlite
      # Inside the container 127.0.0.1 is the container itself, so the
      # llama-server started on the host by `make ocr-server` is reached via
      # host.docker.internal. `environment` wins over env_file, so a loopback
      # URL in .env (meant for non-Docker runs) does not leak in here.
      PAPERPILOT_OCR_BASE_URL: ${PAPERPILOT_DOCKER_OCR_BASE_URL:-http://host.docker.internal:8080/v1}
    env_file:
      - path: .env
        required: false
    extra_hosts:
      # Docker Desktop defines this name already; Linux engines need the mapping.
      - "host.docker.internal:host-gateway"
    volumes:
      - paperpilot-data:/data
    restart: unless-stopped

volumes:
  paperpilot-data:
