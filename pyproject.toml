[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperpilot"
version = "0.1.0"
description = "A verifiable, citation-grounded multi-agent system for analysing research papers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PaperPilot" }]
keywords = ["research", "pdf", "agents", "rag", "verification"]

# Every dependency below maps to a concrete requirement in the MVP.
dependencies = [
  "pydantic>=2.7",          # typed agent contracts and validation
  "pydantic-settings>=2.2", # environment-driven configuration
  "fastapi>=0.110",         # HTTP API
  "uvicorn>=0.29",          # ASGI server for the API
  "python-multipart>=0.0.9",# multipart PDF upload
  "pymupdf>=1.24",          # PDF text/blocks/bbox extraction
  "numpy>=1.26",            # vector similarity and numeric checks
  "httpx>=0.27",            # OpenAI-compatible provider transport
  "markdown-it-py>=3.0",    # deterministic parsing of Markdown model answers
  "pyyaml>=6.0",            # per-agent reference guides (agents/specs/*.yaml)
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pillow>=10.0"]
# Document layout analysis (PP-Structure). Pinned rather than bounded: a new
# model or release finds different regions, which would change the parse of a
# paper under the caller without a line of PaperPilot changing.
layout = ["paddlepaddle==3.3.1", "paddleocr==3.7.0", "pillow>=10.0"]
embeddings = ["sentence-transformers>=2.7"]
local-llm = ["transformers>=4.56", "torch>=2.4"]
faiss = ["faiss-cpu>=1.8"]
qdrant = ["qdrant-client>=1.9"]
rerank = ["flashrank>=0.2.5"]
langgraph = ["langgraph>=0.1"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
]

[project.scripts]
paperpilot = "paperpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperpilot = ["web/*.html", "agents/prompts/*.md", "agents/specs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: long-running tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
