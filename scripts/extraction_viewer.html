<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extraction Viewer</title>
<!--
  Inspect the output of `paperpilot ingest <paper.pdf> --json-out extraction.json`.
  Open this file in a browser and drop the JSON on it. Nothing leaves the browser.
-->
<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --surface-2: #f0efeb;
    --border: #e2e0da;
    --text: #1d1d1b;
    --muted: #6b6a64;
    --accent: #2f5bd3;
    --accent-soft: #e6ecfb;
    --ok: #1f7a4d;
    --ok-soft: #e3f3ea;
    --warn: #a35c00;
    --warn-soft: #fbefdc;
    --bad: #b42318;
    --bad-soft: #fde8e6;
    --ocr: #6b3fc4;
    --ocr-soft: #efe8fb;
    --mark: #ffe58a;
    --glyph: #ffc9c4;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413;
      --surface: #1d1d1b;
      --surface-2: #262624;
      --border: #34332f;
      --text: #ecebe6;
      --muted: #9c9a92;
      --accent: #8aa8ff;
      --accent-soft: #23304f;
      --ok: #5cc98f;
      --ok-soft: #173326;
      --warn: #f0a640;
      --warn-soft: #3a2a12;
      --bad: #ff8a80;
      --bad-soft: #3d1c19;
      --ocr: #b99bff;
      --ocr-soft: #2c2343;
      --mark: #6b5a12;
      --glyph: #6e2a24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --surface: #1d1d1b; --surface-2: #262624; --border: #34332f;
    --text: #ecebe6; --muted: #9c9a92; --accent: #8aa8ff; --accent-soft: #23304f;
    --ok: #5cc98f; --ok-soft: #173326; --warn: #f0a640; --warn-soft: #3a2a12;
    --bad: #ff8a80; --bad-soft: #3d1c19; --ocr: #b99bff; --ocr-soft: #2c2343;
    --mark: #6b5a12; --glyph: #6e2a24;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 var(--sans);
    min-height: 100vh;
  }
  button, input, select { font: inherit; color: inherit; }
  code, pre, .mono { font-family: var(--mono); }

  header.bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  header.bar h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; }
  header.bar .file { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .btn {
    border: 1px solid var(--border); background: var(--surface-2);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  :root[data-theme="dark"] .btn.primary { color: #10131c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #10131c; } }

  main { max-width: 1400px; margin: 0 auto; padding: 16px; }

  /* --- empty state --- */
  .drop {
    margin: 8vh auto 0; max-width: 640px;
    border: 2px dashed var(--border); border-radius: 16px;
    background: var(--surface); padding: 40px 28px; text-align: center;
  }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop h2 { margin: 0 0 6px; font-size: 20px; }
  .drop p { color: var(--muted); margin: 0 0 20px; }
  .cmd {
    display: flex; align-items: center; gap: 8px; text-align: left;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 8px 8px 12px; margin-top: 20px;
  }
  .cmd code { flex: 1; overflow-x: auto; white-space: nowrap; font-size: 12.5px; }
  body.dragging::after {
    content: "Drop the extraction JSON"; position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center; font-size: 22px; font-weight: 600;
    background: color-mix(in srgb, var(--accent-soft) 88%, transparent);
    border: 3px dashed var(--accent); color: var(--accent);
  }
  .error {
    max-width: 640px; margin: 16px auto 0; padding: 10px 14px; border-radius: 8px;
    background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad);
  }

  /* --- summary --- */
  .doc-title { font-size: 20px; font-weight: 600; margin: 0 0 2px; }
  .doc-sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; word-break: break-all; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; text-align: left; cursor: default;
    display: flex; flex-direction: column; justify-content: flex-start;
  }
  button.stat { cursor: pointer; }
  button.stat:hover { border-color: var(--accent); }
  .stat .n { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: 12px; }
  .stat.warn .n { color: var(--warn); }
  .stat.bad .n { color: var(--bad); }
  .stat.ocr .n { color: var(--ocr); }
  .stat.ok .n { color: var(--ok); }
  .notice {
    padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; font-size: 13px;
    border: 1px solid var(--border); background: var(--surface);
  }
  .notice.warn { background: var(--warn-soft); border-color: var(--warn); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
    padding: 3px 10px; font-size: 12.5px; cursor: pointer;
  }
  .chip b { font-variant-numeric: tabular-nums; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  /* --- workspace --- */
  .work { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
  .side {
    position: sticky; top: 62px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    display: flex; flex-direction: column; max-height: calc(100vh - 80px);
  }
  .side .tools { padding: 10px; border-bottom: 1px solid var(--border); display: grid; gap: 8px; }
  .search {
    width: 100%; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-2);
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button {
    flex: 1 1 auto; border: 1px solid var(--border); background: var(--surface-2);
    border-radius: 6px; padding: 3px 6px; font-size: 12px; cursor: pointer;
  }
  .seg button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .pages { overflow-y: auto; padding: 6px; }
  .page-row {
    display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 8px;
    width: 100%; text-align: left; border: 0; background: transparent;
    padding: 7px 8px; border-radius: 8px; cursor: pointer;
  }
  .page-row:hover { background: var(--surface-2); }
  .page-row.sel { background: var(--accent-soft); }
  .page-row .t { font-weight: 500; }
  .page-row .s { color: var(--muted); font-size: 12px; display: block; }
  .page-row .c { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .dot.ocr { background: var(--ocr); }
  .dot.kept { background: var(--bad); }
  .dot.low { background: var(--warn); }
  .empty-list { color: var(--muted); padding: 16px; text-align: center; font-size: 13px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--muted); padding: 8px 10px; border-top: 1px solid var(--border); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend .dot { width: 8px; height: 8px; }

  .detail { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; min-width: 0; }
  .detail-head { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .detail-head .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .detail-head h2 { margin: 0; font-size: 18px; }
  .nav { margin-left: auto; display: flex; gap: 6px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
  .badge.native { background: var(--ok-soft); color: var(--ok); }
  .badge.ocr { background: var(--ocr-soft); color: var(--ocr); }
  .badge.kept { background: var(--bad-soft); color: var(--bad); }
  .badge.plain { background: var(--surface-2); color: var(--muted); }
  .meta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; }
  .conf { display: inline-flex; align-items: center; gap: 6px; }
  .conf i { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .conf i b { display: block; height: 100%; background: var(--ok); }
  .conf.mid i b { background: var(--warn); }
  .conf.low i b { background: var(--bad); }
  .callout { margin-top: 12px; border-radius: 10px; padding: 10px 12px; font-size: 13px; border: 1px solid; }
  .callout.ocr { background: var(--ocr-soft); border-color: var(--ocr); }
  .callout.kept { background: var(--bad-soft); border-color: var(--bad); }
  .callout strong { display: block; margin-bottom: 4px; }
  .callout ul { margin: 4px 0 0; padding-left: 18px; }

  .tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tabs button {
    border: 0; background: transparent; padding: 10px 12px; cursor: pointer;
    color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 500; }
  .pane { padding: 14px 16px 18px; }
  .pane-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 12.5px; color: var(--muted); }
  .pane-tools label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  pre.text {
    margin: 0; padding: 12px 14px; border-radius: 8px;
    background: var(--surface-2); border: 1px solid var(--border);
    white-space: pre-wrap; word-break: break-word; font-size: 12.5px; line-height: 1.55;
    max-height: 70vh; overflow: auto;
  }
  pre.text.nowrap { white-space: pre; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }
  .glyph { background: var(--glyph); border-radius: 2px; outline: 1px solid var(--bad); }
  .ws { color: var(--muted); opacity: .5; }

  .chunk { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .chunk-head {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
    padding: 8px 12px; background: var(--surface-2); font-size: 12.5px;
  }
  .chunk-head .sec { color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
  .chunk-head .id { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
  .type { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 5px; text-transform: uppercase; letter-spacing: .02em; }
  .type.paragraph { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
  .type.table { background: var(--accent-soft); color: var(--accent); }
  .type.figure { background: var(--ocr-soft); color: var(--ocr); }
  .type.equation { background: var(--warn-soft); color: var(--warn); }
  .type.reference { background: var(--ok-soft); color: var(--ok); }
  .type.unknown { background: var(--bad-soft); color: var(--bad); }
  .chunk pre.text { border: 0; border-radius: 0; max-height: 420px; }
  .muted { color: var(--muted); }

  .kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

  @media (max-width: 860px) {
    .work { grid-template-columns: 1fr; }
    .side { position: static; max-height: none; }
    .pages { max-height: 260px; }
    header.bar .hint { display: none; }
  }
  @media (max-width: 520px) {
    main { padding: 12px 16px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .nav { margin-left: 0; width: 100%; }
    .nav .btn { flex: 1; }
  }
</style>
</head>
<body>
<header class="bar">
  <h1>Extraction Viewer</h1>
  <span class="file" id="fileName"></span>
  <span class="hint muted" style="font-size:12px"><span class="kbd">←</span> <span class="kbd">→</span> pages · <span class="kbd">/</span> search</span>
  <button class="btn" id="themeBtn" title="Toggle light/dark">◐</button>
  <button class="btn primary" id="openBtn">Open JSON</button>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</header>

<main id="app"></main>

<script>
(() => {
  "use strict";

  const COMMAND = "paperpilot ingest path/to/paper.pdf --json-out extraction.json";
  const SUSPECT = /\(cid:\d+\)|[�-\u0000-\u0008\u000b\u000c\u000e-\u001f]/;

  const app = document.getElementById("app");
  const fileInput = document.getElementById("fileInput");
  const fileName = document.getElementById("fileName");

  const state = {
    data: null, pages: [], chunksByPage: new Map(), selected: 0,
    filter: "all", element: null, query: "", tab: "text",
    showGlyphs: true, wrap: true, chunkType: null,
  };

  // --- utilities -----------------------------------------------------------

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
  const fmt = (n) => (n ?? 0).toLocaleString();
  const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

  function highlight(text) {
    const parts = [];
    if (state.showGlyphs) parts.push(SUSPECT.source);
    if (state.query) parts.push(reEsc(state.query));
    if (!parts.length) return esc(text);
    const re = new RegExp(parts.map((p) => `(${p})`).join("|"), "gi");
    let out = "", last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m[0] === "") { re.lastIndex++; continue; }
      out += esc(text.slice(last, m.index));
      const glyph = state.showGlyphs && m[1] !== undefined;
      const shown = glyph && m[0].length === 1
        ? `U+${m[0].charCodeAt(0).toString(16).toUpperCase().padStart(4, "0")}`
        : m[0];
      out += glyph
        ? `<span class="glyph" title="Unmapped glyph: ${esc(shown)}">${esc(m[0].length === 1 ? "⟨" + shown + "⟩" : m[0])}</span>`
        : `<mark>${esc(m[0])}</mark>`;
      last = m.index + m[0].length;
    }
    return out + esc(text.slice(last));
  }

  function countSuspect(text) {
    return (String(text || "").match(new RegExp(SUSPECT.source, "g")) || []).length;
  }

  // Page status: what the pipeline did with this page.
  function status(p) {
    if (p.source === "ocr") return "ocr";
    if ((p.extraction_failures || []).length) return "kept";
    if (p.confidence < 1) return "low";
    return "native";
  }
  const STATUS_LABEL = {
    native: "Native text", ocr: "Read by OCR",
    kept: "Flagged · native kept", low: "Low confidence",
  };

  // --- loading -------------------------------------------------------------

  function load(json, name) {
    if (!json || typeof json !== "object" || !Array.isArray(json.chunks) || !json.metadata) {
      throw new Error("This doesn't look like an extraction JSON (expected \"metadata\" and \"chunks\").");
    }
    const chunksByPage = new Map();
    for (const c of json.chunks) {
      if (!chunksByPage.has(c.page)) chunksByPage.set(c.page, []);
      chunksByPage.get(c.page).push(c);
    }

    let pages = Array.isArray(json.pages) ? json.pages.slice() : null;
    const legacy = !pages;
    if (legacy) {
      // Older JSON without page records: rebuild pages from their chunks.
      const count = json.metadata.page_count || Math.max(0, ...chunksByPage.keys());
      pages = Array.from({ length: count }, (_, i) => {
        const cs = chunksByPage.get(i + 1) || [];
        const text = cs.map((c) => c.text).join("\n\n");
        return {
          page: i + 1, text, char_count: text.length,
          source: cs.some((c) => c.source === "ocr") ? "ocr" : "native_text",
          confidence: cs.length ? Math.min(...cs.map((c) => c.confidence ?? 1)) : 1,
          printed_label: cs[0]?.printed_label ?? null, extraction_failures: [],
        };
      });
    }
    pages.sort((a, b) => a.page - b.page);

    Object.assign(state, {
      data: json, pages, chunksByPage, legacy, selected: 0,
      filter: "all", element: null, query: "", tab: "text", chunkType: null,
    });
    fileName.textContent = name || "";
    document.title = `${json.metadata.title || name || "Extraction"} · Extraction Viewer`;
    render();
  }

  function readFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        load(JSON.parse(reader.result), file.name);
      } catch (err) {
        renderEmpty(err.message || String(err));
      }
    };
    reader.onerror = () => renderEmpty("Could not read the file.");
    reader.readAsText(file);
  }

  // --- rendering -----------------------------------------------------------

  function renderEmpty(error) {
    fileName.textContent = "";
    app.innerHTML = `
      <div class="drop" id="drop">
        <h2>Drop an extraction JSON here</h2>
        <p>or <button class="btn primary" id="pickBtn">choose a file</button></p>
        <p style="margin:0">Generate one from any PDF:</p>
        <div class="cmd"><code>${esc(COMMAND)}</code><button class="btn" id="copyBtn">Copy</button></div>
        <p style="margin:14px 0 0;font-size:12.5px">The file is read in your browser; nothing is uploaded.</p>
      </div>
      ${error ? `<div class="error">${esc(error)}</div>` : ""}`;
    document.getElementById("pickBtn").onclick = () => fileInput.click();
    document.getElementById("copyBtn").onclick = (e) => {
      navigator.clipboard?.writeText(COMMAND).then(() => { e.target.textContent = "Copied"; });
    };
  }

  function visiblePages() {
    const q = state.query.toLowerCase();
    return state.pages.filter((p) => {
      const s = status(p);
      if (state.filter === "flagged" && !(p.extraction_failures || []).length) return false;
      if (state.filter === "ocr" && s !== "ocr") return false;
      if (state.filter === "kept" && s !== "kept") return false;
      if (state.filter === "low" && !(p.confidence < 1)) return false;
      if (state.filter === "glyphs" && !countSuspect(p.text)) return false;
      if (state.element && !(state.chunksByPage.get(p.page) || []).some((c) => c.element_type === state.element)) return false;
      if (q && !String(p.text || "").toLowerCase().includes(q)) return false;
      return true;
    });
  }

  function render() {
    const d = state.data;
    const m = d.metadata;
    const ex = d.extraction || null;
    const flagged = state.pages.filter((p) => (p.extraction_failures || []).length);
    const ocr = state.pages.filter((p) => p.source === "ocr");
    const kept = state.pages.filter((p) => status(p) === "kept");
    const low = state.pages.filter((p) => p.confidence < 1);
    const glyphPages = state.pages.filter((p) => countSuspect(p.text));

    const counts = {};
    for (const c of d.chunks) counts[c.element_type] = (counts[c.element_type] || 0) + 1;

    let ocrState = "";
    if (ex) {
      ocrState = !ex.ocr_enabled ? "disabled"
        : ex.ocr_available ? "reachable" : "unreachable";
    }

    const notices = [];
    if (state.legacy) {
      notices.push(`<div class="notice warn">This JSON has no <code>pages</code> section, so page text is rebuilt from chunks and the extraction-check results aren't shown. Re-run <code>${esc(COMMAND)}</code> to get them.</div>`);
    }
    if (ex && kept.length && ocrState !== "reachable") {
      notices.push(`<div class="notice warn"><strong>${kept.length} page${kept.length > 1 ? "s" : ""} failed the extraction check but kept native text</strong>: OCR was ${ocrState}${ex.ocr_base_url ? ` at <code>${esc(ex.ocr_base_url)}</code>` : ""}. Start it with <code>make ocr-server</code> and re-run the command.</div>`);
    }

    app.innerHTML = `
      <div class="doc-title">${esc(m.title || "Untitled document")}</div>
      <div class="doc-sub">
        ${m.authors?.length ? esc(m.authors.join(", ")) + " · " : ""}${esc(m.filename || "")}
        ${m.document_id ? ` · <span class="mono">${esc(m.document_id)}</span>` : ""}
      </div>

      <div class="stats">
        <div class="stat"><div class="n">${fmt(m.page_count || state.pages.length)}</div><div class="l">Pages</div></div>
        <div class="stat"><div class="n">${fmt(d.chunks.length)}</div><div class="l">Chunks</div></div>
        <button class="stat ${flagged.length ? "warn" : "ok"}" data-filter="flagged"><div class="n">${fmt(flagged.length)}</div><div class="l">Failed the check</div></button>
        <button class="stat ${ocr.length ? "ocr" : ""}" data-filter="ocr"><div class="n">${fmt(ocr.length)}</div><div class="l">Read by OCR</div></button>
        <button class="stat ${kept.length ? "bad" : ""}" data-filter="kept"><div class="n">${fmt(kept.length)}</div><div class="l">Flagged, native kept</div></button>
        <button class="stat ${glyphPages.length ? "bad" : ""}" data-filter="glyphs"><div class="n">${fmt(glyphPages.length)}</div><div class="l">Pages with bad glyphs</div></button>
        ${ex ? `<div class="stat ${ocrState === "reachable" ? "ok" : ocrState === "unreachable" ? "bad" : ""}"><div class="n" style="font-size:15px;padding:5px 0 4px">${esc(ex.ocr_engine === "null" ? "none" : ex.ocr_engine)}</div><div class="l">OCR ${esc(ocrState)} · min ${fmt(ex.ocr_min_chars_per_page)} chars</div></div>` : ""}
      </div>

      ${notices.join("")}

      <div class="chips">
        ${Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([t, n]) =>
          `<button class="chip ${state.element === t ? "on" : ""}" data-element="${esc(t)}">${esc(t)} <b>${fmt(n)}</b></button>`).join("")}
        ${m.sections?.length ? `<span class="chip" style="cursor:default">sections <b>${fmt(m.sections.length)}</b></span>` : ""}
      </div>

      <div class="work">
        <aside class="side">
          <div class="tools">
            <input class="search" id="search" type="search" placeholder="Search page text…" value="${esc(state.query)}">
            <div class="seg" id="filters">
              ${[["all", "All"], ["flagged", "Flagged"], ["ocr", "OCR"], ["low", "Low conf."]].map(([k, l]) =>
                `<button data-filter="${k}" class="${state.filter === k ? "on" : ""}">${l}</button>`).join("")}
            </div>
          </div>
          <div class="pages" id="pageList"></div>
          <div class="legend">
            <span><i class="dot"></i>native</span>
            <span><i class="dot ocr"></i>OCR</span>
            <span><i class="dot kept"></i>flagged, kept</span>
            <span><i class="dot low"></i>low conf.</span>
          </div>
        </aside>
        <section class="detail" id="detail"></section>
      </div>`;

    app.querySelectorAll("[data-filter]").forEach((b) => b.onclick = () => {
      const f = b.dataset.filter;
      state.filter = state.filter === f && b.classList.contains("stat") ? "all" : f;
      render();
    });
    app.querySelectorAll("[data-element]").forEach((b) => b.onclick = () => {
      state.element = state.element === b.dataset.element ? null : b.dataset.element;
      state.chunkType = state.element;
      if (state.element) state.tab = "chunks";
      render();
    });
    const search = document.getElementById("search");
    search.oninput = () => {
      state.query = search.value;
      renderList();
      renderDetail();
    };
    renderList();
    renderDetail();
  }

  function renderList() {
    const list = document.getElementById("pageList");
    const pages = visiblePages();
    if (!pages.length) {
      list.innerHTML = `<div class="empty-list">No pages match.</div>`;
      return;
    }
    if (!pages.some((p) => p.page === currentPage()?.page)) {
      state.selected = state.pages.indexOf(pages[0]);
    }
    const q = state.query.toLowerCase();
    list.innerHTML = pages.map((p) => {
      const s = status(p);
      const nChunks = (state.chunksByPage.get(p.page) || []).length;
      const hits = q ? String(p.text || "").toLowerCase().split(q).length - 1 : 0;
      const sub = (p.extraction_failures || [])[0] || STATUS_LABEL[s];
      return `<button class="page-row ${p === currentPage() ? "sel" : ""}" data-page="${p.page}">
        <i class="dot ${s === "native" ? "" : s}"></i>
        <span><span class="t">Page ${p.page}${p.printed_label ? ` <span class="muted">(${esc(p.printed_label)})</span>` : ""}</span>
          <span class="s">${esc(sub)}</span></span>
        <span class="c">${hits ? `${hits} hit${hits > 1 ? "s" : ""}` : `${fmt(p.char_count ?? (p.text || "").length)} ch · ${nChunks}`}</span>
      </button>`;
    }).join("");
    list.querySelectorAll(".page-row").forEach((b) => b.onclick = () => {
      state.selected = state.pages.findIndex((p) => p.page === Number(b.dataset.page));
      renderList();
      renderDetail();
    });
    list.querySelector(".sel")?.scrollIntoView({ block: "nearest" });
  }

  function currentPage() { return state.pages[state.selected]; }

  function step(delta) {
    const pages = visiblePages();
    if (!pages.length) return;
    const i = pages.indexOf(currentPage());
    const next = pages[Math.min(pages.length - 1, Math.max(0, (i < 0 ? 0 : i + delta)))];
    state.selected = state.pages.indexOf(next);
    renderList();
    renderDetail();
  }

  function renderDetail() {
    const el = document.getElementById("detail");
    const p = currentPage();
    if (!p) { el.innerHTML = `<div class="pane muted">No page selected.</div>`; return; }

    const s = status(p);
    const chunks = state.chunksByPage.get(p.page) || [];
    const failures = p.extraction_failures || [];
    const conf = Number(p.confidence ?? 1);
    const confCls = conf >= 0.9 ? "" : conf >= 0.55 ? "mid" : "low";
    const suspect = countSuspect(p.text);
    const ex = state.data.extraction;

    let callout = "";
    if (failures.length) {
      const outcome = s === "ocr"
        ? `Re-extracted by <strong style="display:inline">${esc(ex?.ocr_engine || "OCR")}</strong>; the text below is the model's reading.`
        : "OCR returned nothing or was unreachable, so the native text below was kept at reduced confidence.";
      callout = `<div class="callout ${s === "ocr" ? "ocr" : "kept"}">
        <strong>Failed the extraction check</strong>
        <ul>${failures.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>
        <div style="margin-top:6px">${outcome}</div>
      </div>`;
    }

    const types = [...new Set(chunks.map((c) => c.element_type))];
    const shownChunks = state.chunkType ? chunks.filter((c) => c.element_type === state.chunkType) : chunks;

    el.innerHTML = `
      <div class="detail-head">
        <div class="row">
          <h2>Page ${p.page}</h2>
          ${p.printed_label ? `<span class="badge plain">printed “${esc(p.printed_label)}”</span>` : ""}
          <span class="badge ${s === "low" ? "kept" : s === "native" ? "native" : s}">${STATUS_LABEL[s]}</span>
          <div class="nav">
            <button class="btn" id="prevBtn">← Prev</button>
            <button class="btn" id="nextBtn">Next →</button>
          </div>
        </div>
        <div class="meta">
          <span class="conf ${confCls}">confidence <i><b style="width:${Math.round(conf * 100)}%"></b></i> ${conf.toFixed(2)}</span>
          <span>${fmt(p.char_count ?? (p.text || "").length)} characters</span>
          <span>${fmt(chunks.length)} chunk${chunks.length === 1 ? "" : "s"}</span>
          ${p.width ? `<span>${Math.round(p.width)} × ${Math.round(p.height)} pt</span>` : ""}
          ${suspect ? `<span style="color:var(--bad)">${fmt(suspect)} unmapped glyph${suspect > 1 ? "s" : ""}</span>` : ""}
        </div>
        ${callout}
      </div>
      <div class="tabs">
        <button data-tab="text" class="${state.tab === "text" ? "on" : ""}">Page text</button>
        <button data-tab="chunks" class="${state.tab === "chunks" ? "on" : ""}">Chunks (${fmt(chunks.length)})</button>
      </div>
      <div class="pane">
        <div class="pane-tools">
          <label><input type="checkbox" id="glyphToggle" ${state.showGlyphs ? "checked" : ""}> highlight unmapped glyphs</label>
          <label><input type="checkbox" id="wrapToggle" ${state.wrap ? "checked" : ""}> wrap lines</label>
          ${state.tab === "chunks" && types.length > 1 ? `<span class="seg" id="typeFilter">
            <button data-type="" class="${!state.chunkType ? "on" : ""}">all</button>
            ${types.map((t) => `<button data-type="${esc(t)}" class="${state.chunkType === t ? "on" : ""}">${esc(t)}</button>`).join("")}
          </span>` : ""}
        </div>
        ${state.tab === "text"
          ? (p.text ? `<pre class="text ${state.wrap ? "" : "nowrap"}">${highlight(p.text)}</pre>`
                    : `<div class="muted">This page has no text.</div>`)
          : (shownChunks.length ? shownChunks.map(renderChunk).join("")
                                : `<div class="muted">No chunks${state.chunkType ? ` of type ${esc(state.chunkType)}` : ""} on this page.</div>`)}
      </div>`;

    el.querySelector("#prevBtn").onclick = () => step(-1);
    el.querySelector("#nextBtn").onclick = () => step(1);
    el.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; renderDetail(); });
    el.querySelector("#glyphToggle").onchange = (e) => { state.showGlyphs = e.target.checked; renderDetail(); };
    el.querySelector("#wrapToggle").onchange = (e) => { state.wrap = e.target.checked; renderDetail(); };
    el.querySelectorAll("[data-type]").forEach((b) => b.onclick = () => { state.chunkType = b.dataset.type || null; renderDetail(); });
  }

  function renderChunk(c) {
    const where = [c.section, c.subsection].filter(Boolean).join(" › ");
    const range = c.char_start != null ? `chars ${fmt(c.char_start)}–${fmt(c.char_end)}` : "";
    const conf = Number(c.confidence ?? 1);
    return `<div class="chunk">
      <div class="chunk-head">
        <span class="type ${esc(c.element_type)}">${esc(c.element_type)}</span>
        ${c.element_id ? `<strong>${esc(c.element_id)}</strong>` : ""}
        ${where ? `<span class="sec">${esc(where)}</span>` : ""}
        ${c.source === "ocr" ? `<span class="badge ocr">OCR</span>` : ""}
        ${conf < 1 ? `<span class="badge ${conf < 0.55 ? "kept" : "plain"}">conf ${conf.toFixed(2)}</span>` : ""}
        <span class="id" title="${esc(range)}">${esc(c.chunk_id)}</span>
      </div>
      <pre class="text ${state.wrap ? "" : "nowrap"}">${highlight(c.text)}</pre>
    </div>`;
  }

  // --- wiring --------------------------------------------------------------

  document.getElementById("openBtn").onclick = () => fileInput.click();
  fileInput.onchange = () => { readFile(fileInput.files[0]); fileInput.value = ""; };

  let dragDepth = 0;
  window.addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
  window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => {
    e.preventDefault();
    dragDepth = 0;
    document.body.classList.remove("dragging");
    readFile(e.dataTransfer.files[0]);
  });

  window.addEventListener("keydown", (e) => {
    if (!state.data) return;
    const typing = e.target.matches("input, textarea");
    if (e.key === "/" && !typing) { e.preventDefault(); document.getElementById("search")?.focus(); return; }
    if (e.key === "Escape" && typing) { e.target.blur(); return; }
    if (typing) return;
    if (e.key === "ArrowRight" || e.key === "j") step(1);
    if (e.key === "ArrowLeft" || e.key === "k") step(-1);
  });

  const root = document.documentElement;
  try { const t = localStorage.getItem("extraction-viewer-theme"); if (t) root.dataset.theme = t; } catch {}
  document.getElementById("themeBtn").onclick = () => {
    const dark = root.dataset.theme
      ? root.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("extraction-viewer-theme", root.dataset.theme); } catch {}
  };

  renderEmpty();
})();
</script>
</body>
</html>
